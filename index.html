<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Equipos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Gestión de Equipos y Componentes</h1>
      <p>Proyecto integrador - Supabase</p>
    </header>

    <section class="card">
      <h2 id="titulo-formulario">Registrar componente</h2>

      <form id="formulario">
        <input type="hidden" id="id">

        <div class="grid">
          <label>Código
            <input id="codigo" type="text" required placeholder="ARD001">
          </label>

          <label>Nombre
            <input id="nombre" type="text" required placeholder="Arduino Uno">
          </label>

          <label>Categoría
            <select id="categoria" required>
              <option value="">Seleccionar...</option>
              <option>Arduino</option>
              <option>Sensores</option>
              <option>Computadoras</option>
              <option>Monitores</option>
              <option>Periféricos</option>
              <option>Componentes electrónicos</option>
              <option>Herramientas</option>
              <option>Redes</option>
              <option>Otros</option>
            </select>
          </label>

          <label>Marca
            <input id="marca" type="text" placeholder="Genérico">
          </label>

          <label>Cantidad
            <input id="cantidad" type="number" min="0" step="1" required value="0">
          </label>

          <label>Estado
            <select id="estado" required>
              <option value="">Seleccionar...</option>
              <option>Disponible</option>
              <option>En uso</option>
              <option>Reparación</option>
              <option>Baja</option>
            </select>
          </label>
        </div>

        <label>Descripción
          <textarea id="descripcion" rows="3" placeholder="Información adicional"></textarea>
        </label>

        <div class="botones">
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" id="btn-cancelar" class="secundario hidden">Cancelar edición</button>
        </div>

        <p id="mensaje"></p>
      </form>
    </section>

    <section class="card">
      <h2>Listado</h2>

      <div class="filtros">
        <input id="buscar" type="search" placeholder="Buscar por código, nombre o marca...">

        <select id="filtro-categoria">
          <option value="">Todas las categorías</option>
          <option>Arduino</option>
          <option>Sensores</option>
          <option>Computadoras</option>
          <option>Monitores</option>
          <option>Periféricos</option>
          <option>Componentes electrónicos</option>
          <option>Herramientas</option>
          <option>Redes</option>
          <option>Otros</option>
        </select>

        <select id="filtro-estado">
          <option value="">Todos los estados</option>
          <option>Disponible</option>
          <option>En uso</option>
          <option>Reparación</option>
          <option>Baja</option>
        </select>
      </div>

      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Marca</th>
              <th>Cantidad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
